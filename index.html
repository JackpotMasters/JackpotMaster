<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JackpotMaster</title>
<meta name="description" content="Des jackpots gratuits tous les soirs. Version test.">
<meta name="theme-color" content="#FFF1DC">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="JackpotMaster">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
html,body{height:100%}
body{margin:0;background:#FFF1DC;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#app{min-height:100%}


a{color:#B45309}a:hover{color:#92400E}
button{font-family:inherit;cursor:pointer}
button:disabled{cursor:default}
button{transition:transform .12s ease}
button:active:not(:disabled){transform:scale(.95)}
@keyframes jm-plus{0%{transform:scale(.3);opacity:0}25%{transform:scale(1.3);opacity:1}45%{transform:scale(1)}80%{opacity:1;transform:translateY(-30px)}100%{opacity:0;transform:translateY(-60px)}}
@keyframes jm-ring{0%{transform:scale(.2);opacity:1}100%{transform:scale(4.5);opacity:0}}
@keyframes jm-wiggle{0%,60%,100%{transform:rotate(0) scale(1)}10%{transform:rotate(-6deg) scale(1.08)}20%{transform:rotate(6deg) scale(1.08)}30%{transform:rotate(-3deg) scale(1.04)}40%{transform:rotate(0) scale(1)}}
@keyframes jm-b0{to{transform:translate(120px,40px) rotate(360deg);opacity:0}}
@keyframes jm-b1{to{transform:translate(148px,101px) rotate(-300deg);opacity:0}}
@keyframes jm-b2{to{transform:translate(85px,125px) rotate(280deg);opacity:0}}
@keyframes jm-b3{to{transform:translate(61px,188px) rotate(-360deg);opacity:0}}
@keyframes jm-b4{to{transform:translate(0,160px) rotate(320deg);opacity:0}}
@keyframes jm-b5{to{transform:translate(-61px,188px) rotate(-280deg);opacity:0}}
@keyframes jm-b6{to{transform:translate(-85px,125px) rotate(360deg);opacity:0}}
@keyframes jm-b7{to{transform:translate(-148px,101px) rotate(-320deg);opacity:0}}
@keyframes jm-b8{to{transform:translate(-120px,40px) rotate(300deg);opacity:0}}
@keyframes jm-b9{to{transform:translate(-148px,-21px) rotate(-360deg);opacity:0}}
@keyframes jm-b10{to{transform:translate(-85px,-45px) rotate(280deg);opacity:0}}
@keyframes jm-b11{to{transform:translate(-61px,-108px) rotate(-300deg);opacity:0}}
@keyframes jm-b12{to{transform:translate(0,-80px) rotate(360deg);opacity:0}}
@keyframes jm-b13{to{transform:translate(61px,-108px) rotate(-280deg);opacity:0}}
@keyframes jm-b14{to{transform:translate(85px,-45px) rotate(320deg);opacity:0}}
@keyframes jm-b15{to{transform:translate(148px,-21px) rotate(-360deg);opacity:0}}
@keyframes jm-gold-in{0%{transform:translateY(-380px) rotateY(0) rotateZ(-20deg) scale(.4);opacity:0}15%{opacity:1}55%{transform:translateY(16px) rotateY(540deg) rotateZ(4deg) scale(1.12)}75%{transform:translateY(-6px) rotateY(700deg) rotateZ(-2deg) scale(.98)}100%{transform:translateY(0) rotateY(720deg) rotateZ(0) scale(1);opacity:1}}
@keyframes jm-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes jm-sheen{0%{left:-120px}45%,100%{left:340px}}
@keyframes jm-spin{to{transform:rotate(360deg)}}
@keyframes jm-fade{from{opacity:0}to{opacity:1}}
@keyframes jm-rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes jm-twinkle{0%,100%{transform:scale(0) rotate(0);opacity:0}50%{transform:scale(1) rotate(90deg);opacity:1}}
@keyframes jm-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes jm-pop-in{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes jm-drop{from{opacity:0;transform:translateY(-24px)}to{opacity:1;transform:none}}
@keyframes jm-tickA{0%{transform:translateY(-40%) scale(1.3);opacity:.15}60%{transform:translateY(0) scale(.95);opacity:1}100%{transform:none;opacity:1}}
@keyframes jm-tickB{0%{transform:translateY(-40%) scale(1.3);opacity:.15}60%{transform:translateY(0) scale(.95);opacity:1}100%{transform:none;opacity:1}}
@keyframes jm-heart{0%,100%{transform:scale(1)}12%{transform:scale(1.14)}24%{transform:scale(1)}36%{transform:scale(1.08)}50%{transform:scale(1)}}
@keyframes jm-shake{0%,100%{transform:translate(0,0) rotate(0)}20%{transform:translate(-2px,1px) rotate(-2deg)}40%{transform:translate(2px,-1px) rotate(2deg)}60%{transform:translate(-1px,-1px) rotate(-1deg)}80%{transform:translate(1px,1px) rotate(1deg)}}
@keyframes jm-glow{0%,100%{box-shadow:0 10px 24px rgba(225,29,72,.3)}50%{box-shadow:0 0 0 6px rgba(251,113,133,.35),0 14px 40px rgba(225,29,72,.6)}}
@keyframes jm-glow-gold{0%,100%{box-shadow:0 12px 28px rgba(234,88,12,.3)}50%{box-shadow:0 0 0 6px rgba(252,211,77,.45),0 14px 40px rgba(245,158,11,.7)}}
@keyframes jm-countA{0%{transform:scale(1.9);opacity:0}30%{transform:scale(1);opacity:1}100%{transform:scale(.9);opacity:.8}}
@keyframes jm-countB{0%{transform:scale(1.9);opacity:0}30%{transform:scale(1);opacity:1}100%{transform:scale(.9);opacity:.8}}
@keyframes jm-fw{0%{transform:translateY(0);opacity:0}5%{opacity:1}60%{opacity:1}100%{transform:translateY(-80px);opacity:0}}
@keyframes jm-slam{0%{transform:scale(3) rotate(-8deg);opacity:0}60%{transform:scale(.92) rotate(-8deg);opacity:1}100%{transform:scale(1) rotate(-6deg);opacity:1}}
@keyframes jm-slide{from{background-position:0 0}to{background-position:200% 0}}
@keyframes jm-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}
@keyframes jm-sheet{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes jm-fall{0%{transform:translateY(-60px) rotate(0);opacity:0}10%{opacity:1}100%{transform:translateY(900px) rotate(540deg);opacity:1}}

</style>
</head>
<body>
<div id="app"></div>
<noscript>JackpotMaster a besoin de JavaScript.</noscript>
<script type="text/x-template" id="tpl">
<div style="width: 100%; max-width: 480px; margin: 0 auto; height: 100vh; height: 100dvh; box-sizing: border-box; background: linear-gradient(180deg, #FFF1DC 0%, #FFF7EC 30%, #FFFAF3 100%); color: #1E1640; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <div aria-hidden="true" :style="goldWashStyle"></div>

  <header style="position: relative; z-index: 1; display: flex; align-items: center; justify-content: space-between; padding: calc(20px + env(safe-area-inset-top)) 20px 12px">
    <div style="display: flex; align-items: center; gap: 8px">
      <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="#F59E0B"/><circle cx="16" cy="16" r="11" fill="none" stroke="#FFF7EC" stroke-width="1.5" stroke-dasharray="2 2.5"/><path d="M16 8l2.3 4.8 5.2.7-3.8 3.6.9 5.2-4.6-2.5-4.6 2.5.9-5.2-3.8-3.6 5.2-.7z" fill="#FFF7EC"/></svg>
      <div style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700; letter-spacing: -0.3px">Jackpot<span style="color: #C2410C">Master</span></div>
    </div>
    <div :style="badgeStyle">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#D97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8a2 2 0 0 0 2-2h14a2 2 0 0 0 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 0-2 2H5a2 2 0 0 0-2-2v-2a2 2 0 0 0 0-4z"/><path d="M13 6v12" stroke-dasharray="2 2"/></svg>
      <span>{{ticketsLabel}}</span>
    </div>
  </header>

  <template v-if="eventOn">
    <button type="button" @click="eventGo" :style="eventStyle">
      <span :style="eventDotStyle"></span>
      <span style="flex: 1; text-align: left">{{eventText}}</span>
      <span style="font-family: 'Space Grotesk', sans-serif; font-variant-numeric: tabular-nums; font-size: 15px">{{eventCd}}</span>
      <span style="position: absolute; top: -10px; bottom: -10px; left: -120px; width: 50px; background: linear-gradient(105deg, transparent, rgba(255,255,255,0.6), transparent); transform: skewX(-20deg); animation: jm-sheen 2.6s ease-in-out infinite"></span>
    </button>
  </template>

  <template v-if="onJackpots">
    <nav aria-label="Les trois jackpots" style="position: relative; z-index: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin: 0 20px; padding: 4px; background: #FFFFFF; border: 1px solid #F0E4D2; border-radius: 14px">
      <template v-for="(tab, tab_i) in tabs" :key="tab_i">
        <button type="button" @click="tab.pick" :style="tab.style">{{tab.label}}</button>
      </template>
    </nav>
  </template>

  <main style="position: relative; z-index: 1; flex: 1; overflow-y: auto; padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 16px">

    <template v-if="isSuper">
      <section style="display: flex; flex-direction: column; gap: 16px">
        <template v-if="showInstallBanner">
          <div style="position: relative; overflow: hidden; display: flex; align-items: center; gap: 12px; background: linear-gradient(135deg, #1E1640, #3B2A7A); color: #FFFFFF; border-radius: 18px; padding: 12px 12px 12px 14px; box-shadow: 0 8px 20px rgba(30,22,64,0.25)">
            <div style="flex-shrink: 0; width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg, #FDE68A, #F59E0B); display: flex; align-items: center; justify-content: center; animation: jm-float 2.4s ease-in-out infinite"><svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 6l2.6 5.4 5.9.8-4.3 4.1 1 5.9-5.2-2.8-5.2 2.8 1-5.9-4.3-4.1 5.9-.8z" fill="#FFFFFF"/></svg></div>
            <div style="flex: 1; min-width: 0"><div style="font-size: 15px; font-weight: 700">Installe l'appli</div><div style="font-size: 12px; color: #D6CCF5">Gratuit, 10 secondes, sans passer par un store</div></div>
            <button type="button" @click="openInstall" style="flex-shrink: 0; min-height: 40px; padding: 0 14px; border: none; border-radius: 999px; background: #FCD34D; color: #1E1640; font-size: 14px; font-weight: 700">Installer</button>
            <button type="button" @click="hideInstallBanner" aria-label="Fermer" style="flex-shrink: 0; width: 32px; height: 40px; border: none; background: none; color: #D6CCF5; font-size: 20px; padding: 0">×</button>
            <span style="position: absolute; top: -10px; bottom: -10px; left: -120px; width: 40px; background: linear-gradient(105deg, transparent, rgba(255,255,255,0.25), transparent); transform: skewX(-20deg); animation: jm-sheen 3s ease-in-out infinite; pointer-events: none"></span>
          </div>
        </template>
        <div style="position: relative; overflow: hidden; background: linear-gradient(135deg, #14B8A6 0%, #0369A1 100%); border-radius: 24px; padding: 22px 20px; display: flex; flex-direction: column; gap: 6px; color: #FFFFFF; box-shadow: 0 10px 24px rgba(3,105,161,0.28)">
          <svg width="120" height="120" viewBox="0 0 120 120" aria-hidden="true" style="position: absolute; right: -14px; top: -14px; opacity: 0.35"><path d="M60 8l6 22 22 6-22 6-6 22-6-22-22-6 22-6z" fill="#FFFFFF"/><path d="M96 66l3 10 10 3-10 3-3 10-3-10-10-3 10-3z" fill="#FFFFFF"/><circle cx="30" cy="80" r="3" fill="#FFFFFF"/></svg>
          <div style="font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px">Super Jackpot · ce soir 21 h</div>
          <div style="font-family: 'Space Grotesk', sans-serif; font-size: 48px; font-weight: 700; letter-spacing: -1px">{{superAmount}}</div>
          <div style="font-size: 13px">Un gagnant chaque soir. Chaque pub vue fait grossir le jackpot.</div>
        </div>

        <div>
          <div :style="cdSuperLabelStyle">{{cdSuperLabel}}</div>
          <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
            <div :style="superBox"><div :style="superNumH">{{cdSuper.h}}</div><div style="font-size: 12px; color: #6B6385">heures</div></div>
            <div :style="superBox"><div :style="superNumM">{{cdSuper.m}}</div><div style="font-size: 12px; color: #6B6385">minutes</div></div>
            <div :style="superBox"><div :style="superNumS">{{cdSuper.s}}</div><div style="font-size: 12px; color: #6B6385">secondes</div></div>
          </div>
          <template v-if="showDeadline"><div :style="deadlineStyle">{{deadlineText}}</div></template>
        </div>

        <template v-if="ticketNotClaimed">
          <button type="button" @click="claimTicket" style="min-height: 58px; border: none; border-radius: 18px; background: linear-gradient(135deg, #FCD34D 0%, #F59E0B 100%); color: #1E1640; font-size: 17px; font-weight: 700; box-shadow: 0 8px 18px rgba(245,158,11,0.35)">Récupérer mon ticket du jour</button>
        </template>
        <template v-if="ticketClaimed">
          <div style="min-height: 58px; border-radius: 18px; background: #E6F7F5; border: 1.5px solid #14B8A6; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 600; color: #0F5F58">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0F766E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>
            Ticket du jour récupéré, rendez-vous à 21 h
          </div>
        </template>

        <div style="background: #FFFFFF; border: 1px solid #F0E4D2; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
          <div style="display: flex; justify-content: space-between; align-items: baseline">
            <div style="font-size: 15px; font-weight: 700">Plus de chances ce soir</div>
            <div style="font-size: 13px; color: #6B6385">{{pubsLeftLabel}}</div>
          </div>
          <button type="button" @click="watchAd" :disabled="adDisabled" :style="adButtonStyle">Regarder une pub · +1 ticket</button>
          <div style="position: relative; overflow: hidden; border-radius: 16px; background: linear-gradient(135deg, #FFFBEB, #FDE68A); border: 1.5px solid #F59E0B; padding: 14px; display: flex; gap: 12px; align-items: center">
            <div style="position: relative; flex-shrink: 0; width: 76px; height: 46px; border-radius: 8px; background: linear-gradient(135deg, #FEF3C7 0%, #FCD34D 30%, #F59E0B 60%, #D97706 100%); box-shadow: 0 4px 10px rgba(180,83,9,0.35); overflow: hidden; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.9 6.3 6.9.7-5.2 4.6 1.5 6.8L12 17l-6.1 3.4 1.5-6.8L2.2 9l6.9-.7z" fill="#FFFBEB" stroke="#B45309" stroke-width="1.2"/></svg><span style="position: absolute; top: -10px; bottom: -10px; left: -120px; width: 30px; background: linear-gradient(105deg, transparent, rgba(255,255,255,0.85), transparent); transform: skewX(-20deg); animation: jm-sheen 2.4s ease-in-out infinite"></span></div>
            <div style="flex: 1; min-width: 0">
              <div style="font-size: 15px; font-weight: 700; color: #451A03">Ticket d'or</div>
              <div style="font-size: 12px; color: #78350F; margin-top: 2px">{{goldCardText}}</div>
              <div style="height: 8px; background: rgba(255,255,255,0.75); border-radius: 999px; overflow: hidden; margin-top: 8px"><div :style="goldBarStyle"></div></div>
            </div>
          </div>
          <template v-if="goldDayReady"><button type="button" @click="activateGoldDay" style="position: relative; overflow: hidden; min-height: 54px; border: none; border-radius: 14px; background: linear-gradient(135deg, #FDE68A, #F59E0B 50%, #FCD34D); color: #451A03; font-size: 16px; font-weight: 700; box-shadow: 0 8px 20px rgba(245,158,11,0.5); animation: jm-wiggle 1.8s ease-in-out infinite">Récupérer mon ticket d'or<span style="position: absolute; top: -20px; bottom: -20px; left: -120px; width: 60px; background: linear-gradient(105deg, transparent, rgba(255,255,255,0.8), transparent); transform: skewX(-20deg); animation: jm-sheen 2.2s ease-in-out infinite"></span></button></template>
        </div>
        <div style="border: 1.5px dashed #D9CFE0; border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 8px">
          <div style="font-size: 12px; font-weight: 700; color: #6B6385; text-transform: uppercase; letter-spacing: 1px">Essayer (mode démo)</div>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px">
            <button type="button" @click="superDemoGo" style="min-height: 44px; border: 1px solid #E8DCC8; background: #FFFFFF; border-radius: 12px; font-size: 12px; font-weight: 600; color: #1E1640">{{superDemoLabel}}</button>
            <button type="button" @click="superLive" style="min-height: 44px; border: 1px solid #E8DCC8; background: #FFFFFF; border-radius: 12px; font-size: 12px; font-weight: 600; color: #1E1640; background: #1E1640; color: #FFFFFF; border-color: #1E1640">{{superLiveLabel}}</button>
            <button type="button" @click="superWin" style="min-height: 44px; border: 1px solid #E8DCC8; background: #FFFFFF; border-radius: 12px; font-size: 12px; font-weight: 600; color: #1E1640">Tirage gagné</button>
            <button type="button" @click="superLose" style="min-height: 44px; border: 1px solid #E8DCC8; background: #FFFFFF; border-radius: 12px; font-size: 12px; font-weight: 600; color: #1E1640">Tirage perdu</button>
            <button type="button" @click="superLate" style="min-height: 44px; border: 1px solid #E8DCC8; background: #FFFFFF; border-radius: 12px; font-size: 12px; font-weight: 600; color: #1E1640; grid-column: 1 / -1">J'ouvre l'appli après le tirage</button>
          </div>
        </div>
      </section>
    </template>

    <template v-if="isMega">
      <section style="display: flex; flex-direction: column; gap: 14px">
        <div :style="megaHeroStyle">
          <template v-if="megaDay"><div style="position: absolute; right: 16px; top: 16px; z-index: 1; background: #FFFFFF; color: #BE123C; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 14px; padding: 6px 12px; border-radius: 999px; animation: jm-heart 1.1s ease-in-out infinite">JOUR J</div></template>
          <svg width="120" height="120" viewBox="0 0 120 120" aria-hidden="true" style="position: absolute; right: -14px; top: -14px; opacity: 0.35"><path d="M60 8l6 22 22 6-22 6-6 22-6-22-22-6 22-6z" fill="#FFFFFF"/><path d="M96 66l3 10 10 3-10 3-3 10-3-10-10-3 10-3z" fill="#FFFFFF"/><circle cx="30" cy="80" r="3" fill="#FFFFFF"/></svg>
          <div style="font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px">Méga Jackpot · {{megaMonth}}</div>
          <div style="font-family: 'Space Grotesk', sans-serif; font-size: 44px; font-weight: 700; letter-spacing: -1px">{{megaAmount}}</div>
          <div style="font-size: 13px; font-weight: 600">{{megaWhen}}</div>
        </div>

        <div>
          <div :style="megaCdLabelStyle">{{megaCdLabel}}</div>
          <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
            <div :style="megaBox"><div :style="megaNumD">{{cdMega.d}}</div><div style="font-size: 12px; color: #6B6385">jours</div></div>
            <div :style="megaBox"><div :style="megaNumH">{{cdMega.h}}</div><div style="font-size: 12px; color: #6B6385">heures</div></div>
            <div :style="megaBox"><div :style="megaNumM">{{cdMega.m}}</div><div style="font-size: 12px; color: #6B6385">min</div></div>
            <div :style="megaBox"><div :style="megaNumS">{{cdMega.s}}</div><div style="font-size: 12px; color: #6B6385">s</div></div>
          </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 8px">
          <div style="display: flex; justify-content: space-between; align-items: baseline">
            <div style="font-size: 15px; font-weight: 700">{{megaProgressLabel}}</div>
            <div :style="`font-size: 13px; font-weight: 600; color: ${megaStatusColor}`">{{megaStatus}}</div>
          </div>
          <div style="height: 12px; background: #FFE4E6; border-radius: 999px; overflow: hidden"><div :style="megaBarStyle"></div></div>
        </div>

        <div style="background: #FFFFFF; border: 1px solid #F0E4D2; border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px">
          <div style="display: flex; justify-content: space-between; align-items: baseline"><div style="font-size: 15px; font-weight: 700">Mes places au Méga</div><div style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700; color: #BE123C">{{megaTotal}}</div></div>
          <div style="display: flex; justify-content: space-between; font-size: 13px"><span>Qualification (25 jours)</span><span style="font-weight: 700">{{megaQual}}</span></div>
          <div style="display: flex; justify-content: space-between; font-size: 13px"><span>Jours bonus au-delà de 25</span><span style="font-weight: 700">{{megaBonus}}</span></div>
          <div style="display: flex; justify-content: space-between; font-size: 13px"><span>Tickets d'or (10 pubs dans une journée)</span><span style="font-weight: 700">{{megaGold}}</span></div>
          <div style="font-size: 12px; color: #6B6385">{{megaMax}}</div>
        </div>

        <div style="background: #FFFFFF; border: 1px solid #F0E4D2; border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 8px">
          <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; font-size: 11px; color: #6B6385; text-align: center; font-weight: 600">
            <div>L</div><div>M</div><div>M</div><div>J</div><div>V</div><div>S</div><div>D</div>

      androidTabStyle: 'min-height: 44px; border: none; border-radius: 10px; font-size: 14px; font-weight: 700; ' + (s.installOs === 'android' ? 'background: #1E1640; color: #FFFFFF;' : 'background: transparent; color: #6B6385;'),
      installDone: () => { if (this.state.installOs === 'android' && window.jmInstallPrompt) { const p = window.jmInstallPrompt; window.jmInstallPrompt = null; p.prompt(); p.userChoice.then((c) => { if (c.outcome === 'accepted') this.markInstalled(); }); this.setState({ installOpen: false }); return; } this.markInstalled(); },
      markInstalledUnused: () => this.setState({ installOpen: false, installed: true, burstUntil: Date.now() + 1300, burstLabel: 'Appli installée !', burstKind: 'gold', toast: 'JackpotMaster est sur ton écran d’accueil', toastUntil: Date.now() + 2800 }),
      installRowLabel: s.installed ? 'Appli installée ✓' : 'Installer l’appli sur mon téléphone'
    };
  }
}

// Ce qui doit rester d'une visite à l'autre (même jour)
const KEEP = ['claimed', 'pubs', 'adTickets', 'caughtUp', 'goldDayClaimed', 'claimedFriends', 'friendBonus', 'installBannerHidden', 'installed', 'notifReminder', 'notifResults', 'notifWinners', 'filter'];
const dayKey = () => new Date().toDateString();
const { createApp, reactive, computed, markRaw } = Vue;
const comp = new Component({});
try {
  const saved = JSON.parse(localStorage.getItem('jm-state') || 'null');
  if (saved && saved.day === dayKey()) { KEEP.forEach((k) => { if (k in saved.s) comp.state[k] = saved.s[k]; }); comp.state.displayTickets = 0; }
  else if (saved) { ['installBannerHidden', 'installed', 'notifReminder', 'notifResults', 'notifWinners'].forEach((k) => { if (k in saved.s) comp.state[k] = saved.s[k]; }); }
} catch (e) {}
if (window.jmStandalone) comp.state.installed = true;
comp.state = reactive(comp.state);
const vals = computed(() => comp.renderVals());
const keys = Object.keys(comp.renderVals());
createApp({
  template: document.getElementById('tpl').innerHTML,
  setup() {
    const out = {};
    keys.forEach((k) => Object.defineProperty(out, k, { enumerable: true, get: () => vals.value[k] }));
    return out;
  },
  mounted() {
    comp.componentDidMount();
    setInterval(() => {
      try { const o = {}; KEEP.forEach((k) => { o[k] = comp.state[k]; }); localStorage.setItem('jm-state', JSON.stringify({ day: dayKey(), s: o })); } catch (e) {}
    }, 1000);
  }
}).mount('#app');
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));

</script>
</body>
